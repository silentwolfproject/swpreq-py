[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swpreq"
version = "0.1.0"
description = "Powerful cross-platform HTTP client with Rust core"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "silentwolfproject" }]
keywords = ["http", "client", "async", "requests", "swpreq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/silentwolfproject/swpreq-py"
Repository = "https://github.com/silentwolfproject/swpreq-py"
Issues = "https://github.com/silentwolfproject/swpreq/issues"

[tool.setuptools]
packages = ["swpreq"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
swpreq = [
    "lib/**/*.dll",
    "lib/**/*.so",
    "lib/**/*.dylib",
    "py.typed",
]