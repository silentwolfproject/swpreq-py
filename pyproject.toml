[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swpreq"
version = "0.2.0"
description = "High-performance HTTP client for Python with a Rust core"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SilentWolfProject" }]
keywords = [
    "http",
    "client",
    "async",
    "requests",
    "rust",
    "websocket",
    "http2",
    "sse",
    "streaming",
    "multipart",
    "oauth",
    "swpreq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Android",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/silentwolfproject/swpreq-py"
Repository = "https://github.com/silentwolfproject/swpreq-py"
Issues = "https://github.com/silentwolfproject/swpreq-py/issues"
Changelog = "https://github.com/silentwolfproject/swpreq-py/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["swpreq"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
swpreq = [
    "lib/**/*.dll",
    "lib/**/*.so",
    "lib/**/*.dylib",
    "py.typed",
]

[tool.setuptools.exclude-package-data]
swpreq = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]